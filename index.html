<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17232E">
  <meta name="description" content="Personal digital business card.">
  <title>Digital Business Card</title>
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./config.js"></script>
  <script defer src="./script.js"></script>
</head>
<body>
  <div class="world" id="world" aria-hidden="true"></div>
  <main class="page">
    <div class="card" id="card" hidden>
      <header class="hero">
        <div class="avatar" id="avatar" aria-hidden="true" hidden>
          <span id="monogram"></span>
        </div>
        <h1 id="profile-name"></h1>
        <p class="subtitle" id="profile-subtitle"></p>
        <p class="tagline" id="profile-tagline"></p>
      </header>
      <nav class="connections" id="connections" aria-label="Contact and social links" hidden>
        <ul class="link-list" id="social-links" role="list"></ul>
      </nav>
    </div>
    <p class="card fallback" id="config-error" hidden>The digital business card is temporarily unavailable.</p>
    <noscript><p class="card fallback">Enable JavaScript to view this digital business card.</p></noscript>
  </main>
</body>
</html>
